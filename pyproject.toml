[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-adapter"
version = "0.1.0"
description = "Independent next-token decision API over an unmodified inference server"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.10,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.12"]
performance = ["aiohttp>=3.11,<4"]
native-tokenizer = ["transformers==5.12.1", "mistral-common==1.11.7"]
candidate-readout = ["numpy>=1.26,<3"]
learned-head = ["numpy>=1.26,<3", "safetensors>=0.5,<1"]
readout-export = [
    "numpy>=1.26,<3",
    "safetensors>=0.5,<1",
    "torch>=2.5,<3",
    "transformers==5.12.1",
    "mistral-common==1.11.7",
]

[project.scripts]
jev-adapter = "jev_adapter.__main__:main"
jev-export-readout = "jev_adapter.export_readout:main"

[tool.setuptools.packages.find]
include = ["jev_adapter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
